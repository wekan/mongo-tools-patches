name: Release All

# Build the MongoDB Database Tools (bsondump, mongodump, mongoexport, mongofiles,
# mongoimport, mongorestore, mongostat, mongotop) for EVERY platform WeKan ships
# a bundle for, and attach one <tool>-<arch>[.exe] binary per platform to the
# GitHub Release of that version - the same shape wekan/FerretDB's and
# wekan/node-patches' release-all.yml have: individual per-arch assets, no zip,
# so a consumer downloads only the file for the platform it targets.
#
# This repo carries only PATCHES. Each run clones upstream mongodb/mongo-tools
# master, including changes not yet in a release, applies
# the checksum-verified patches in dist/, and builds that
# (releases/apply-patches.sh). So there is no mongo-tools fork to maintain -
# 738 directories of Go source that carried no WeKan change at all, only the
# build below. See docs/Design/Directory-structure.md.
#
# ONE JOB BUILDS EVERY PLATFORM, which is where this differs from
# wekan/node-patches: the tools are pure Go with CGO disabled, so every target is
# a `GOOS=... GOARCH=... go build` on the ordinary x86_64 runner - no container,
# no cross toolchain, no emulation, and minutes rather than the hours a V8 build
# takes. That is also why there is no per-platform patch section here: a single
# checkout produces all forty-two targets, so a patch that concerns one GOOS or
# GOARCH carries a Go build constraint instead of living in its own directory
# (dist/README.md).
#
# Because the tools are pure Go, architectures MongoDB ships no prebuilt tools
# for - riscv64, loong64, and every 32-bit one - are built here too. A target
# that fails to compile is skipped and reported, never fatal: the build says
# which, and that is the moment a patch in dist/ becomes worth writing.
#
# EACH BINARY IS ON THE RELEASE AS SOON AS IT IS FINISHED. The release is
# created (empty) before the build, and build-tools.sh attaches every binary
# with its .sha256sum the moment it has compiled and passed the telemetry audit
# (MONGO_TOOLS_PUBLISH) - so mongodump-amd64 is downloadable while the other 343
# are still compiling, and a CANCELLED run keeps everything it finished: an
# always() step attaches any finished binary whose upload was cut short
# (attach-finished.sh), and the last step checks none is missing.
#
# A release ACCUMULATES: a run's freshly built binaries overwrite their own old
# copies (gh release upload --clobber) and every other asset is left in place, so
# all platforms of a version collect on one release across however many runs it
# takes (that is what Release All Missing is for). Each version has its own tag,
# so accumulating within a tag only gathers builds of that one version.
#
# Usage:
#   gh workflow run release-all.yml                    # current upstream master
#   gh workflow run release-all.yml -f version=100.18.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream ref to build, e.g. master or 100.18.0 (empty = master)'
        required: false
        type: string
      publish:
        description: 'Attach the binaries to the GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# Two runs against one release would race on the same assets. A second run waits
# for the first rather than clobbering it half way through.
concurrency:
  group: mongo-tools-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build every tool for every platform
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # This repo carries only PATCHES, not a mongo-tools tree. So: check the
      # patches out into _patches/, clone the matching UPSTREAM release into the
      # workspace root, and apply the patches on top - after which the workspace
      # is an ordinary mongo-tools source tree and the build below is the same
      # build the retired fork ran.
      - name: Check out the patches
        uses: actions/checkout@v7
        with:
          path: _patches

      - name: Check dependency risk indicators before release work
        shell: bash
        run: python3 _patches/releases/remote-release.py --audit

      - name: Fetch upstream mongo-tools and apply the patches
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          SOURCE=$(python3 _patches/releases/remote-release.py --upstream-version all "$REQUESTED_VERSION")
          bash _patches/releases/apply-patches.sh _patches "$SOURCE"
          # Preserve legacy release names when completing an existing release.
          if [[ "$REQUESTED_VERSION" =~ ^master-[0-9a-f]{7,12}$ ]]; then
            echo "VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
            echo "TOOLS_VER=$REQUESTED_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Restore reviewed dependencies, remove telemetry and audit source
        run: bash _patches/releases/update-dependencies.sh

      # The release has to exist BEFORE the build, because each binary is
      # attached to it the moment it is finished. It is created empty, with
      # placeholder notes; the real notes are written once the build is over.
      # --target pins a NEW tag to the commit that was built rather than to
      # whatever the default branch has moved to since.
      - name: Create the release, so each binary can be attached as it is built
        id: release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_REPO, because gh works out WHICH repository to talk to from the
          # git remote of the working directory - and after apply-patches.sh the
          # working directory is the UPSTREAM clone, whose origin is
          # mongodb/mongo-tools. Without this, the first run's publish answered
          #   HTTP 403: Resource not accessible by integration
          #   (https://api.github.com/repos/mongodb/mongo-tools/releases)
          # after building all 128 binaries: it was trying to create the release
          # on MongoDB's repository, which this token has no business writing to.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --notes "Building. Each binary and its .sha256sum is attached here as soon as it is built and checked; these notes are replaced when the build is over."
          fi

      # build-tools.sh compiles, audits and checksums one binary at a time and
      # hands each finished one to MONGO_TOOLS_PUBLISH, so it is on the release
      # while the rest still compile. A failed attach does not stop the build;
      # the step fails at the end, and the steps below attach what is missing.
      - name: Cross-compile every tool for every platform, attaching each as it is done
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # see "Create the release" above
          MONGO_TOOLS_PUBLISH: ${{ inputs.publish && format('{0}/_patches/.github/scripts/upload-release-assets.sh', github.workspace) || '' }}
        run: bash _patches/.github/scripts/build-tools.sh

      # always(): these run after a CANCEL too, so a cancelled run keeps every
      # binary it finished. They depend on the RELEASE step, not the build: a
      # build that was cancelled or failed half way has still finished some
      # binaries, and attach-finished.sh attaches only those - never a file whose
      # audit or checksum did not complete.
      - name: Compose the release notes
        if: ${{ always() && inputs.publish && steps.release.outcome == 'success' }}
        run: |
          set -euo pipefail
          git log --oneline --no-decorate -30 > upstream-notes.md

          # What this run FINISHED, for the platform line - the finished list,
          # not out/, because after a cancel out/ can hold a binary whose
          # compile or audit never completed. Checksums are not listed there.
          plats="$( (cat .tools/finished.list 2>/dev/null || true) \
            | sed -n 's#^mongodump-##p' | sed 's#\.exe$##' | sort -u | tr '\n' ' ')"

          {
            echo "MongoDB Database Tools 🍃"
            echo ""
            echo "One \`<tool>-<arch>[.exe]\` binary per platform - bsondump, mongodump, mongoexport, mongofiles, mongoimport, mongorestore, mongostat, mongotop - for use with WeKan and FerretDB v1."
            echo ""
            echo "Platforms: ${plats% }"
            echo ""
            echo "Built from upstream mongodb/mongo-tools ref \`${SOURCE_REF}\` at \`${UPSTREAM_COMMIT}\`, including unreleased changes, with the reviewed Go toolchain and locked module graph. Patches in dist/ are then applied and the tools are cross-compiled with CGO disabled."
            echo ""
            echo "Every binary has a \`<name>.sha256sum\` beside it. To check a download:"
            echo ""
            echo '```'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/mongodump-amd64"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/mongodump-amd64.sha256sum"
            echo "sha256sum -c mongodump-amd64.sha256sum"
            echo '```'
            echo ""
            echo "Source provenance:"
            echo ""
            echo "| Upstream | Ref | Build tag | Commit |"
            echo "|----------|--------|-----|--------|"
            echo "| [mongodb/mongo-tools](https://github.com/mongodb/mongo-tools) | \`${SOURCE_REF}\` | \`${RELEASE_TAG}\` | [\`${UPSTREAM_COMMIT}\`](https://github.com/mongodb/mongo-tools/commit/${UPSTREAM_COMMIT}) |"
            echo ""
            echo "Recent upstream commits included in this source snapshot:"
            echo '```'
            cat upstream-notes.md
            echo '```'
          } > release-notes.md

          echo "----- release notes for $VERSION -----"
          cat release-notes.md

      - name: Attach any finished binary that is not on the release yet, and the notes
        if: ${{ always() && inputs.publish && steps.release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # see "Create the release" above
        run: |
          set -euo pipefail
          bash _patches/.github/scripts/attach-finished.sh "$RELEASE_TAG"
          if [ -f release-notes.md ]; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

      # Last: every binary this run finished must be on the release. The build
      # step already failed if an attach did; this says WHICH, after the
      # catch-up above had its chance.
      - name: Check that every finished binary is on the release
        if: ${{ always() && inputs.publish && steps.release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # see "Create the release" above
        run: |
          set -euo pipefail
          bash _patches/.github/scripts/attach-finished.sh "$RELEASE_TAG" --check
          echo "The release now carries these assets (accumulated across runs):"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
